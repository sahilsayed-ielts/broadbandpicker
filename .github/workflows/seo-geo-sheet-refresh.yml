name: Refresh SEO and GEO Google Sheet

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "components/**"
      - "data/**"
      - "lib/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
  schedule:
    # Every Monday at 05:15 UTC. Workbook timestamps are recorded explicitly.
    - cron: "15 5 * * 1"

permissions:
  contents: read

concurrency:
  group: seo-geo-sheet-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install research dependencies
        run: pip install -r requirements-seo.txt

      - name: Crawl site and upsert native Google Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BROADBANDPICKER_GOOGLE_SHEET_ID: 19zz-7Zy1k1tED4MqpMNv2msx0JvNpbE_hyfTymu5GZc
        run: python3 scripts/build_uk_broadband_seo_plan.py --sync-google-sheet
